<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surprise Picture Dice</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #30206b, transparent 45%),
        linear-gradient(135deg, #070714, #11142d);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

.title {
    font-size: clamp(38px, 8vw, 72px);
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #9d7cff, #ff65c7, #5ceaff);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #9da4c7;
    font-size: 16px;
    margin-bottom: 30px;
}

.game {
    background: rgba(20, 24, 52, 0.8);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 30px;
    padding: 25px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    backdrop-filter: blur(15px);
}

.dice-area {
    height: 390px;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
}

.dice {
    width: 190px;
    height: 190px;
    border-radius: 35px;
    background:
        linear-gradient(145deg, #a57cff, #6648cf);
    border: 3px solid rgba(255,255,255,0.35);
    box-shadow:
        inset 0 0 35px rgba(255,255,255,0.18),
        0 30px 60px rgba(80,50,180,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform 0.2s;
    user-select: none;
}

.dice:hover {
    transform: translateY(-8px) rotate(-3deg);
}

.dice:active {
    transform: scale(0.94);
}

.dice-symbol {
    font-size: 90px;
}

.rolling {
    animation: roll 1.2s ease-in-out;
}

@keyframes roll {
    0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
    }

    20% {
        transform: rotateX(180deg) rotateY(220deg) rotateZ(80deg) scale(1.05);
    }

    40% {
        transform: rotateX(420deg) rotateY(450deg) rotateZ(170deg) scale(0.92);
    }

    60% {
        transform: rotateX(650deg) rotateY(700deg) rotateZ(260deg) scale(1.08);
    }

    80% {
        transform: rotateX(900deg) rotateY(950deg) rotateZ(330deg) scale(0.96);
    }

    100% {
        transform: rotateX(1080deg) rotateY(1080deg) rotateZ(360deg) scale(1);
    }
}

.roll-button {
    width: 100%;
    max-width: 420px;
    height: 65px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(90deg, #7657e9, #c05ad7);
    color: white;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(110,70,220,0.3);
    transition: 0.2s;
}

.roll-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 45px rgba(110,70,220,0.45);
}

.roll-button:active {
    transform: scale(0.98);
}

.result {
    margin-top: 30px;
    display: none;
    animation: reveal 0.7s ease;
}

.result.show {
    display: block;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: scale(0.85) translateY(20px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.result-title {
    color: #858daf;
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

.result-image {
    width: 100%;
    max-width: 650px;
    max-height: 550px;
    object-fit: contain;
    border-radius: 25px;
    display: block;
    margin: auto;
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
}

.result-text {
    margin-top: 18px;
    font-size: 30px;
    font-weight: bold;
}

.hint {
    margin-top: 15px;
    color: #737b9d;
    font-size: 13px;
}

.loading {
    color: #aaa;
    font-size: 18px;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .game {
        padding: 16px;
        border-radius: 24px;
    }

    .dice-area {
        height: 310px;
    }

    .dice {
        width: 145px;
        height: 145px;
        border-radius: 27px;
    }

    .dice-symbol {
        font-size: 65px;
    }

    .roll-button {
        height: 60px;
        font-size: 14px;
    }

    .result-image {
        max-height: 450px;
        border-radius: 18px;
    }

    .result-text {
        font-size: 25px;
    }

    .subtitle {
        font-size: 14px;
    }
}

@media (max-width: 380px) {

    .title {
        font-size: 36px;
    }

    .dice-area {
        height: 270px;
    }

    .dice {
        width: 125px;
        height: 125px;
    }

    .dice-symbol {
        font-size: 55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="title">SURPRISE DICE</h1>

    <p class="subtitle">
        Roll the dice and discover your surprise.
    </p>

    <div class="game">

        <div class="dice-area">

            <div class="dice" id="dice" onclick="rollDice()">

                <div class="dice-symbol">
                    🎲
                </div>

            </div>

        </div>

        <button class="roll-button" onclick="rollDice()">
            🎲 ROLL THE DICE
        </button>

        <p class="hint">
            Tap the dice or the button to roll
        </p>

        <div class="result" id="result">

            <div class="result-title">
                Let's do 
            </div>

            <img
                id="resultImage"
                class="result-image"
                src=""
                alt="Dice result"
            >

            <div class="result-text" id="resultText">
                Surprise!
            </div>

        </div>

    </div>

</div>


<script>




const pictures = [

    "picture1.jpg",

    "picture2.jpg",

    "picture3.jpg",

    "picture4.jpg",

    "picture5.jpg",

    "picture6.jpg",

    "picture7.jpg",

    "picture8.jpg",

    "picture9.jpg",

    "picture10.jpg"

];



const dice = document.getElementById("dice");

const result = document.getElementById("result");

const resultImage = document.getElementById("resultImage");

const resultText = document.getElementById("resultText");


let rolling = false;


/* Create rolling sound using the browser itself */
let audioContext;

function playRollSound() {

    try {

        audioContext =
            audioContext ||
            new (window.AudioContext || window.webkitAudioContext)();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "square";

        oscillator.frequency.setValueAtTime(
            120,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            700,
            audioContext.currentTime + 0.15
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            160,
            audioContext.currentTime + 0.8
        );

        gain.gain.setValueAtTime(
            0.001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.08,
            audioContext.currentTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.9
        );

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.9
        );

    } catch (error) {

        console.log("Audio unavailable.");

    }

}


function playRevealSound() {

    try {

        audioContext =
            audioContext ||
            new (window.AudioContext || window.webkitAudioContext)();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            500,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            1000,
            audioContext.currentTime + 0.25
        );

        gain.gain.setValueAtTime(
            0.001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.12,
            audioContext.currentTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.4
        );

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.4
        );

    } catch (error) {

        console.log("Audio unavailable.");

    }

}


/* Roll function */
function rollDice() {

    if (rolling) {
        return;
    }

    rolling = true;

    result.classList.remove("show");

    dice.classList.add("rolling");

    playRollSound();


    setTimeout(function() {

        const randomNumber =
            Math.floor(
                Math.random() * pictures.length
            );


        resultImage.src =
            pictures[randomNumber];


        resultImage.onerror = function() {

            alert(
                "Picture not found: " +
                pictures[randomNumber] +
                "\\n\\nCheck your images folder and filename."
            );

        };


        resultText.innerText =
            "Picture " +
            (randomNumber + 1);


        result.classList.add("show");

        playRevealSound();


        dice.classList.remove("rolling");

        rolling = false;

    }, 1200);

}


document.addEventListener(
    "keydown",
    function(event) {

        if (event.code === "Space") {

            event.preventDefault();

            rollDice();

        }

    }
);

</script>

</body>
</html>
